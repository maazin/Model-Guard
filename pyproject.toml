[project]
name = "modelguard"
version = "0.1.0"
description = "ModelGuard - governed credit-risk (PD) model lifecycle platform. Portfolio simulation, not a lending system."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "joblib>=1.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.40"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "types-python-dateutil",
    "types-pyyaml",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
dev-mode-dirs = ["apps/api", "packages/ml", "packages/governance", "packages/shared"]
packages = [
    "apps/api/modelguard_api",
    "packages/ml/modelguard_ml",
    "packages/governance/modelguard_governance",
    "packages/shared/modelguard_shared",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["apps/web", "artifacts", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["B008", "E501", "N803", "N806", "N812", "N818"]  # Depends() defaults; long literals; ML naming (X, M)

[tool.mypy]
python_version = "3.12"
packages = ["modelguard_ml", "modelguard_governance", "modelguard_shared", "modelguard_api"]
mypy_path = "apps/api:packages/ml:packages/governance:packages/shared"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api", "packages/ml", "packages/governance", "packages/shared"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["integration: API-level lifecycle tests"]

[tool.coverage.run]
source = ["modelguard_ml", "modelguard_governance", "modelguard_shared", "modelguard_api"]
omit = ["*/alembic/*", "*/seed.py", "*/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: modelguard
          POSTGRES_PASSWORD: modelguard
          POSTGRES_DB: modelguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U modelguard" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv --python 3.13 && uv pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - name: Type check
        run: .venv/bin/mypy
      - name: Migrations apply on PostgreSQL
        env:
          MODELGUARD_DATABASE_URL: postgresql+psycopg://modelguard:modelguard@localhost:5432/modelguard_test
        run: cd apps/api && ../../.venv/bin/alembic upgrade head && ../../.venv/bin/alembic downgrade base
      - name: Unit + integration tests (SQLite, offline)
        run: .venv/bin/python -m pytest -q --cov --cov-report=xml --cov-fail-under=80
      - name: Integration tests on PostgreSQL
        env:
          MODELGUARD_DATABASE_URL: postgresql+psycopg://modelguard:modelguard@localhost:5432/modelguard_test
        run: .venv/bin/python -m pytest -q tests/integration
      - name: Local secrets scan
        run: .venv/bin/python scripts/secrets_scan.py
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint --silent
      - run: npx tsc -b --noEmit
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: uv venv --python 3.13 && uv pip install -e ".[dev]"
      - run: cd apps/web && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Seed and start API
        run: |
          cd apps/api && ../../.venv/bin/alembic upgrade head && cd ../..
          .venv/bin/python apps/api/modelguard_api/seed.py
          (.venv/bin/uvicorn modelguard_api.main:app --port 8000 &) && sleep 3
      - run: cd apps/web && npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images (not published)
        run: |
          docker build -f infra/docker/Dockerfile.api -t modelguard-api:ci .
          docker build -f infra/docker/Dockerfile.web -t modelguard-web:ci .
